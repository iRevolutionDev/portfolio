[package]
name = "backend"
version = "0.1.0"
edition = "2021"

[dependencies]
argon2 = "0.6.0-pre.1"
axum = "0.8.4"
axum-extra = { version = "0.10.1", features = ["typed-header"] }
axum-macros = "0.5.0"
tower-http = { version = "0.6.2", features = ["cors"] }
jsonwebtoken = "10.3.0"
once_cell = "1.21.3"
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
shuttle-axum = "0.56.0"
shuttle-runtime = "0.56.0"
shuttle-shared-db = { version = "0.56.0", features = ["postgres", "sqlx"] }
sqlx = { version = "0.8.5", features = ["runtime-tokio-rustls", "macros", "chrono"] }
tokio = "1.50.0"
tracing = "0.1.41"
tracing-subscriber = "0.3.20"
rand = "0.9.1"
reqwest = "0.12.15"
